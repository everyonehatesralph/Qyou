<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Qyou mark: a queue ticket with a Q. Drawn as shapes, so it never depends on a font.
       Same drawing as TicketMark (src/components/ui/Wordmark.tsx) and scripts/icons/app-icon.svg. -->
  <style>
    .ticket { fill: #D92D20 }
    .q { stroke: #FFFFFF }
    /* Dark tab bars: the dark-mode accent, like the app in dark mode */
    @media (prefers-color-scheme: dark) {
      .ticket { fill: #FB7A6A }
      .q { stroke: #18181B }
    }
  </style>
  <path class="ticket" d="M17 6H47A11 11 0 0 1 58 17V27A5 5 0 0 0 58 37V47A11 11 0 0 1 47 58H17A11 11 0 0 1 6 47V37A5 5 0 0 0 6 27V17A11 11 0 0 1 17 6Z"/>
  <g class="q" fill="none" stroke-width="7">
    <circle cx="32" cy="30" r="11.5"/>
    <path d="M33.5 37.5L47.5 46"/>
  </g>
</svg>
