<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Qyou mark: a queue ticket with a Q -->
  <defs>
    <mask id="notches">
      <rect width="64" height="64" fill="white"/>
      <circle cx="6" cy="32" r="6" fill="black"/>
      <circle cx="58" cy="32" r="6" fill="black"/>
    </mask>
  </defs>
  <g transform="rotate(-6 32 32)">
    <rect x="6" y="6" width="52" height="52" rx="10" fill="#D92D20" mask="url(#notches)"/>
    <text x="32" y="44" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF">Q</text>
  </g>
</svg>
