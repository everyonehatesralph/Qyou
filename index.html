<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Qyou — Don't queue. Just Qyou.</title>
    <meta name="description" content="Qyou is QR table ordering for cafés and restaurants: guests scan, order and get notified from their own phone." />
    <!-- Browser toolbar color; follows the app's light/dark mode (inline script below, ThemeContext) -->
    <meta name="theme-color" content="#F8FAFC" />
    <!-- Icons: SVG for tabs (adapts to light/dark tab bars), .ico for browsers without SVG
         favicons, PNG for home screens. Sources and renderer: scripts/build-icons.mjs -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Qyou" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <!-- Set the mode before any CSS renders to prevent a flash -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('qyou_theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
          if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#0F0F11';
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
