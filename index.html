<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Qyou — Don't queue. Just Qyou.</title>
    <meta name="description" content="Qyou is QR table ordering for cafés and restaurants: guests scan, order and get notified from their own phone." />
    <meta name="theme-color" content="#F3F1EC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <!-- Set the mode before any CSS renders to prevent a flash -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('qyou_theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
